experiment:
  name: smpl_hsi_stage2_trstr_v2_strong
  output_dir: outputs/train/smpl_hsi_stage2_trstr_v2_strong
  seed: 42

data:
  dataset: bedlam
  root_key: datasets.bedlam_root
  train_split: Training
  val_split: ""
  sequence_length: 1
  stride: 1
  image_size: 518
  image_resolution: 512
  resize_mode: balanced
  max_humans: 20
  boxes_root_key: ""
  require_boxes: false
  box_free_gt_slots: true
  require_smpl: true
  require_depth: true
  num_workers: 12
  pin_memory: true

model:
  patch_size: 16
  embed_dim: 1024
  enable_camera: true
  enable_depth: true
  enable_alignment: false
  enable_smpl: true
  smpl_provider: gt_perturbed
  gt_smpl_box_free: true
  gt_smpl_online_visibility: true
  num_smpl_queries: 20
  smpl_query_box_prior: false
  smpl_query_patch_pool: false
  smpl_use_aggregator_queries: false
  smpl_track_assignment_mode: gt
  smpl_use_external_track_prior: false
  freeze_aggregator: true
  freeze_aggregator_forward: true
  freeze_camera_head: true
  freeze_dense_head: true

  enable_hsi_refine: true
  freeze_hsi_refinement: true
  freeze_hsi_scene_affine: true
  freeze_hsi_backbone: true
  hsi_scene_affine_mode: per_frame
  hsi_geometry_mode: gt_metric

  enable_hsi_trstr: true
  hsi_trstr_fast_gt: true
  train_hsi_trstr_only: true
  hsi_trstr_hidden_dim: 256
  hsi_trstr_region_embedding_dim: 32
  hsi_trstr_num_regions: 96
  hsi_trstr_representative_vertices: 8
  hsi_trstr_num_iters: 2
  hsi_trstr_patch_sizes: [3, 7]
  hsi_trstr_probe_token_dim: 16
  hsi_trstr_adaptive_radius_max: 8
  hsi_trstr_annulus_width: 2
  hsi_trstr_human_depth_tolerance_m: 0.18
  hsi_trstr_human_depth_dilation_px: 4
  hsi_trstr_enable_temporal: false
  hsi_trstr_temporal_quality_min: 0.25
  hsi_trstr_temporal_gap_max: 8
  hsi_trstr_temporal_use_world: false
  hsi_trstr_min_valid_ratio: 0.25
  hsi_trstr_max_ray_delta_m: 1.00
  hsi_trstr_max_tangent_delta_m: 1.25
  hsi_trstr_max_person_delta_m: 1.25

  enable_hsi_human_scene_align: false
  enable_hsi_translation_refine_v4: false
  enable_hsi_contact_refine: false
  enable_hsi_grounding: false
  enable_hsi_foot_contact_intent: false

checkpoint:
  resume: outputs/train/smpl_hsi_stage2_trstr_v3_scale_spatial/checkpoint_top_train_epoch_0005_loss_total_0.001113.pt
  overlay: outputs/train/smpl_hsi_coarse_residual_stratified_v3/checkpoint_top_train_epoch_0005_loss_total_0.009242.pt
  overlay_prefixes:
    - hsi_refinement_head.
  overlay_required_prefixes:
    - hsi_refinement_head.
  frozen_hash_prefixes:
    - hsi_refinement_head.
  load_vggt_baseline: true
  strict: false
  resume_strict: false
  resume_optimizer: false
  reset_epoch: true
  resume_required_prefixes:
    - hsi_refinement_head.
    - hsi_trstr_head.
  save_scope: hsi
  save_prefixes:
    - hsi_refinement_head.
    - hsi_trstr_head.
  save_optimizer: false
  save_epoch_checkpoint: false
  save_latest: true
  save_final: false
  save_top_k: 1
  save_top_k_from_train: true
  topk_create_stable_copies: false
  monitor: metric_hsi_trstr_xy_refined_l2_p90_m
  monitor_mode: min

optim:
  batch_size: 2
  epochs: 7
  lr: 0.000005
  weight_decay: 0.05
  grad_clip_norm: 1.0
  log_interval: 20
  log_style: progress
  progress_max_loss_items: 20
  progress_log_keys:
    - loss_total
    - loss_hsi_trstr_translation
    - loss_hsi_trstr_vote
    - metric_hsi_trstr_base_translation_l1
    - metric_hsi_trstr_translation_l1
    - metric_hsi_trstr_translation_improvement
    - metric_hsi_trstr_improvement_rate
    - metric_hsi_trstr_base_l2_p90_m
    - metric_hsi_trstr_refined_l2_p90_m
    - metric_hsi_trstr_strong_coverage
    - metric_hsi_trstr_strong_base_l2_mean_m
    - metric_hsi_trstr_strong_refined_l2_mean_m
    - metric_hsi_trstr_strong_improvement_rate
    - metric_hsi_trstr_xy_base_l2_p90_m
    - metric_hsi_trstr_xy_refined_l2_p90_m
    - metric_hsi_trstr_strong_xy_coverage
    - metric_hsi_trstr_strong_xy_improvement_rate
    - metric_trstr_alignment_scale_mean
    - metric_trstr_alignment_target_delta_p90_m
    - metric_trstr_alignment_nlf_delta_p90_m
    - metric_hsi_trstr_clean_displacement_l1
    - metric_hsi_trstr_region_valid_ratio
    - metric_hsi_trstr_monotonic_violation_rate
  save_interval: 1
  max_steps_per_epoch: 0
  drop_no_visible_gt_samples: true
  required_supervision_metric: metric_hsi_trstr_region_valid_ratio
  required_supervision_min: 0.01
  allowed_trainable_prefixes:
    - hsi_trstr_head.
  required_trainable_prefixes:
    - hsi_trstr_head.vote_head.
    - hsi_trstr_head.gate_head.
    - hsi_trstr_head.logvar_head.
    - hsi_trstr_head.person_gate_head.
  required_gradient_prefixes:
    - hsi_trstr_head.vote_head.
    - hsi_trstr_head.gate_head.
  gradient_monitor_prefixes:
    feature: hsi_trstr_head.feature_mlp.
    vote: hsi_trstr_head.vote_head.
    region_gate: hsi_trstr_head.gate_head.
    person_gate: hsi_trstr_head.person_gate_head.
    uncertainty: hsi_trstr_head.logvar_head.

training_prior:
  center_noise: 0.0
  size_noise: 0.0
  drop_prob: 0.0
  smpl_perturb_mode: trstr_scale_alignment
  trstr_alignment_case_probabilities: [0.15, 0.40, 0.25, 0.20]
  trstr_alignment_scale_log_std: 0.08
  trstr_alignment_scale_min: 0.85
  trstr_alignment_scale_max: 1.15
  trstr_alignment_max_target_delta_m: 2.00
  smpl_transl_ray_noise_schedule: 0.0
  smpl_transl_ray_noise_schedule_m: 0.60
  smpl_transl_ray_noise_mode: metric_gaussian_mixture
  smpl_transl_ray_noise_mixture_probabilities: [0.30, 0.40, 0.30]
  smpl_transl_ray_noise_mixture_std_m: [0.06, 0.16, 0.30]
  smpl_transl_ray_noise_mixture_clip_m: [0.15, 0.35, 0.60]
  smpl_transl_tangent_noise_schedule_m: 2.00
  smpl_transl_tangent_noise_mode: metric_gaussian_mixture
  smpl_transl_target_tangent_correction_m: 2.00
  smpl_transl_tangent_noise_mixture_probabilities: [0.20, 0.35, 0.45]
  smpl_transl_tangent_noise_mixture_std_m: [0.12, 0.55, 1.10]
  smpl_transl_tangent_noise_mixture_clip_m: [0.35, 1.20, 2.00]
  smpl_v4_noise_seed: 42
  gt_smpl_visibility_max_points: 512
  gt_smpl_visibility_decode_batch_size: 128
  gt_smpl_visibility_window: 3
  gt_smpl_visibility_tolerance_m: 0.20
  gt_smpl_visibility_min_points: 32

logging:
  wandb:
    enabled: true
    project: vggt-human
    entity: ""
    name: smpl_hsi_stage2_trstr_v2_strong
    group: hsi_stage2_trstr_v2_strong
    mode: online
    log_interval: 20
    tags:
      - hsi
      - trstr
      - v2
      - strong-correction
      - translation-only
      - spatial-only
      - hsi-scale-v3
    log_keys:
      - loss_total
      - loss_hsi_trstr_vote
      - loss_hsi_trstr_translation
      - loss_hsi_trstr_gate
      - loss_hsi_trstr_delta_reg
      - loss_hsi_trstr_monotonic
      - metric_hsi_trstr_translation_l1
      - metric_hsi_trstr_base_translation_l1
      - metric_hsi_trstr_translation_improvement
      - metric_hsi_trstr_improvement_rate
      - metric_hsi_trstr_base_l2_p90_m
      - metric_hsi_trstr_refined_l2_p90_m
      - metric_hsi_trstr_strong_coverage
      - metric_hsi_trstr_strong_base_l2_mean_m
      - metric_hsi_trstr_strong_refined_l2_mean_m
      - metric_hsi_trstr_strong_improvement_rate
      - metric_hsi_trstr_xy_base_l2_p90_m
      - metric_hsi_trstr_xy_refined_l2_p90_m
      - metric_hsi_trstr_strong_xy_coverage
      - metric_hsi_trstr_strong_xy_improvement_rate
      - metric_hsi_trstr_clean_displacement_l1
      - metric_hsi_trstr_region_valid_ratio
      - metric_hsi_trstr_region_gate_mean
      - metric_hsi_trstr_person_gate_mean
      - metric_hsi_trstr_monotonic_violation_rate
      - metric_trstr_alignment_scale_mean
      - metric_trstr_alignment_scale_std
      - metric_trstr_alignment_case_clean_rate
      - metric_trstr_alignment_case_scale_rate
      - metric_trstr_alignment_case_nlf_rate
      - metric_trstr_alignment_case_mixed_rate
      - metric_trstr_alignment_target_delta_p90_m
      - metric_trstr_alignment_nlf_delta_p90_m
      - metric_grad_norm_feature
      - metric_grad_norm_vote
      - metric_grad_norm_region_gate
      - metric_grad_norm_person_gate
      - metric_grad_norm_uncertainty
      - metric_train_dropped_no_visible_sample_rate
      - metric_train_skipped_batch_rate
    scale_chart_interval: 0
    person_table_interval: 0

loss:
  type: hungarian
  hsi_trstr_vote_weight: 1.0
  hsi_trstr_translation_weight: 4.0
  hsi_trstr_gate_weight: 0.10
  hsi_trstr_delta_reg_weight: 0.001
  hsi_trstr_monotonic_weight: 1.0
  hsi_trstr_temporal_velocity_weight: 0.0
  hsi_trstr_temporal_no_worse_weight: 0.0
  hsi_trstr_strong_threshold_m: 0.50
  hsi_trstr_strong_xy_threshold_m: 1.00
  hsi_trstr_vote_target_mode: staged_remaining

matching:
  mode: gt_slots
  enabled: true
  cost_conf: 0.5
  cost_bbox: 0.0
  cost_giou: 0.0
  cost_kpts: 0.0
