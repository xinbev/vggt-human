experiment:
  name: smpl_hsi_gt_depth_scale_scene_affine_boxfree
  output_dir: outputs/train/smpl_hsi_gt_depth_scale_scene_affine_boxfree
  seed: 42

data:
  dataset: bedlam
  root_key: datasets.bedlam_root
  train_split: Training
  val_split: ""
  sequence_length: 2
  stride: 1
  image_size: 518
  image_resolution: 512
  resize_mode: balanced
  max_humans: 20
  boxes_root_key: ""
  require_boxes: false
  box_free_gt_slots: true
  require_smpl: true
  require_depth: true
  num_workers: 12
  pin_memory: true

model:
  patch_size: 16
  embed_dim: 1024
  enable_camera: true
  enable_depth: true
  enable_alignment: false
  enable_smpl: true
  enable_hsi_refine: true
  enable_hsi_human_scene_align: false
  smpl_provider: gt_perturbed
  gt_smpl_box_free: true
  gt_smpl_online_visibility: true
  num_smpl_queries: 20
  smpl_use_aggregator_queries: false
  freeze_aggregator: true
  freeze_camera_head: true
  freeze_dense_head: true
  freeze_aggregator_forward: true
  freeze_hsi_scene_affine: false
  freeze_hsi_backbone: true
  train_hsi_scene_affine_only: true
  predict_boxes: false
  predict_id_embed: false
  smpl_return_aux: false
  smpl_query_box_prior: false
  smpl_query_patch_pool: false
  smpl_track_assignment_mode: gt
  smpl_use_external_track_prior: false
  hsi_hidden_dim: 512
  hsi_num_layers: 5
  hsi_num_heads: 8
  hsi_num_iters: 3
  hsi_scene_window: 3
  hsi_probe_mode: local_nearest
  hsi_affine_probe_mode: local_nearest
  hsi_probe_window: 9
  hsi_scene_affine_mode: per_frame
  hsi_scene_log_scale_min: -5.0
  hsi_scene_log_scale_max: 5.0
  hsi_enable_temporal_momentum: false
  hsi_geometry_mode: gt_metric

checkpoint:
  resume: outputs/train/smpl_hsi_nlf_stage2_human_scene_align_full/checkpoint_latest.pt
  load_vggt_baseline: true
  strict: false
  resume_strict: false
  resume_optimizer: false
  reset_epoch: true
  resume_required_prefixes:
    - hsi_refinement_head.
  save_scope: hsi
  save_prefixes:
    - hsi_refinement_head.
  save_optimizer: false
  save_epoch_checkpoint: false
  save_latest: true
  save_final: false
  save_top_k: 1
  save_top_k_from_train: true
  topk_create_stable_copies: false
  monitor: loss_total
  monitor_mode: min

optim:
  batch_size: 20
  epochs: 5
  lr: 0.00001
  weight_decay: 0.05
  grad_clip_norm: 1.0
  log_interval: 20
  log_style: progress
  progress_bar_width: 28
  progress_max_loss_items: 20
  progress_log_keys:
    - loss_total
    - loss_hsi_smpl_scale_teacher
    - metric_hsi_smpl_scale_teacher_scale
    - metric_hsi_smpl_scale_teacher_pred_scale
    - metric_hsi_smpl_scale_teacher_log_l1
    - metric_hsi_smpl_scale_teacher_rel_l1
    - metric_hsi_smpl_scale_teacher_log10_std
    - metric_hsi_smpl_scale_teacher_pred_log10_std
    - metric_hsi_smpl_scale_teacher_log_correlation
    - metric_hsi_smpl_scale_teacher_identity_log_l1
    - metric_hsi_smpl_scale_teacher_identity_improvement
    - metric_hsi_smpl_scale_teacher_valid_points
    - metric_gt_smpl_visible_people
    - metric_gt_smpl_visibility_keep_ratio
    - metric_hsi_gt_depth_perturb_scale_mean
    - loss_hsi_depth_teacher
    - metric_hsi_depth_teacher_l1
    - metric_train_dropped_no_visible_sample_rate
    - metric_train_skipped_no_supervision_batches
    - metric_train_skipped_batch_rate
    - metric_grad_norm_hsi_scale_delta
    - metric_grad_norm_hsi_bias_delta
    - metric_scale_pipeline_absolute_teacher
    - metric_scale_pipeline_coarse_used
    - metric_scale_pipeline_residual_teacher
    - metric_scale_pipeline_residual_pred
    - metric_scale_pipeline_final_pred
    - metric_scale_pipeline_final_log_l1
    - metric_scale_pipeline_coarse_valid_rate
  save_interval: 1
  max_steps_per_epoch: 0
  drop_no_visible_gt_samples: true
  required_supervision_metric: metric_hsi_smpl_scale_teacher_valid_points
  required_supervision_min: 0.0
  allowed_trainable_prefixes:
    - hsi_refinement_head.scale_delta.
    - hsi_refinement_head.bias_delta.
  required_trainable_prefixes:
    - hsi_refinement_head.scale_delta.
    - hsi_refinement_head.bias_delta.
  required_gradient_prefixes:
    - hsi_refinement_head.scale_delta.
  gradient_monitor_prefixes:
    hsi_scale_delta: hsi_refinement_head.scale_delta.
    hsi_bias_delta: hsi_refinement_head.bias_delta.

training_prior:
  hsi_scale_training_mode: direct_perturb
  center_noise: 0.0
  size_noise: 0.0
  drop_prob: 0.0
  smpl_perturb_mode: translation
  smpl_transl_ray_noise_schedule: 0.0
  smpl_transl_tangent_noise_schedule_m: 0.0
  smpl_transl_ray_noise_clean_prob: 1.0
  smpl_gt_override_prob: 0.0
  hsi_gt_depth_log_scale_std_schedule: 0.30
  hsi_gt_depth_log_scale_mean: 0.0
  hsi_gt_depth_scale_noise_mode: lognormal
  hsi_gt_depth_scale_noise_unit: sequence
  hsi_gt_depth_scale_clean_prob: 0.0
  hsi_gt_depth_scale_min: 0.0
  hsi_gt_depth_scale_max: 0.0
  gt_smpl_visibility_max_points: 512
  gt_smpl_visibility_decode_batch_size: 128
  gt_smpl_visibility_window: 3
  gt_smpl_visibility_tolerance_m: 0.20
  gt_smpl_visibility_max_z_m: 20.0
  gt_smpl_visibility_min_points: 32
  hsi_abs_identity_prob: 0.10
  hsi_abs_near_prob: 0.20
  hsi_abs_near_min: 0.25
  hsi_abs_near_max: 2.0
  hsi_abs_hard_prob: 0.50
  hsi_abs_hard_min: 2.0
  hsi_abs_hard_max: 12.0
  hsi_abs_extreme_prob: 0.20
  hsi_abs_extreme_min: 12.0
  hsi_abs_extreme_max: 20.0
  hsi_coarse_identity_prob: 0.30
  hsi_coarse_near_prob: 0.40
  hsi_coarse_near_min: 0.67
  hsi_coarse_near_max: 1.50
  hsi_coarse_medium_prob: 0.25
  hsi_coarse_medium_min: 0.40
  hsi_coarse_medium_max: 2.50
  hsi_coarse_hard_prob: 0.05
  hsi_coarse_hard_min: 0.25
  hsi_coarse_hard_max: 4.0
  hsi_coarse_anchor_stride: 8
  hsi_coarse_min_anchor_pixels: 32
  hsi_coarse_scale_min: 0.05
  hsi_coarse_scale_max: 25.0
  hsi_coarse_max_relative_mad: 0.50

logging:
  wandb:
    enabled: true
    project: vggt-human
    entity: ""
    name: smpl_hsi_gt_depth_scale_scene_affine_boxfree
    group: hsi_scene_scale_finetune
    mode: online
    log_interval: 20
    scale_chart_interval: 0
    scale_chart_max_points: 1200
    person_table_interval: 0
    person_table_max_rows: 64
    log_keys:
      - loss_total
      - loss_hsi_smpl_scale_teacher
      - metric_hsi_smpl_scale_teacher_log_l1
      - metric_hsi_smpl_scale_teacher_rel_l1
      - metric_hsi_smpl_scale_teacher_scale
      - metric_hsi_smpl_scale_teacher_pred_scale
      - metric_hsi_smpl_scale_teacher_valid_points
      - metric_hsi_smpl_scale_teacher_log10_std
      - metric_hsi_smpl_scale_teacher_pred_log10_std
      - metric_hsi_smpl_scale_teacher_log_correlation
      - metric_hsi_smpl_scale_teacher_identity_log_l1
      - metric_hsi_smpl_scale_teacher_identity_improvement
      - loss_hsi_depth_teacher
      - metric_hsi_depth_teacher_l1
      - metric_hsi_gt_depth_perturb_scale_mean
      - metric_hsi_gt_depth_perturb_target_scale_mean
      - metric_hsi_gt_depth_perturb_log10_scale_std
      - metric_gt_smpl_visible_people
      - metric_gt_smpl_visibility_keep_ratio
      - metric_grad_norm_hsi_scale_delta
      - metric_grad_norm_hsi_bias_delta
      - metric_train_dropped_no_visible_sample_rate
      - metric_train_skipped_no_supervision_batches
      - metric_train_skipped_batch_rate
      - metric_train_optimizer_steps
      - metric_scale_pipeline_coarse_valid_rate
      - metric_scale_pipeline_absolute_teacher
      - metric_scale_pipeline_coarse_estimate
      - metric_scale_pipeline_coarse_used
      - metric_scale_pipeline_coarse_error_factor
      - metric_scale_pipeline_residual_teacher
      - metric_scale_pipeline_residual_pred
      - metric_scale_pipeline_final_teacher
      - metric_scale_pipeline_final_pred
      - metric_scale_pipeline_anchor_count
      - metric_scale_pipeline_coarse_log_l1
      - metric_scale_pipeline_coarse_used_log_l1
      - metric_scale_pipeline_final_log_l1
      - metric_scale_pipeline_person_scale_min
      - metric_scale_pipeline_person_scale_mean
      - metric_scale_pipeline_person_scale_max
      - metric_scale_pipeline_person_scale_std
      - metric_scale_pipeline_person_log_contribution_std
    tags:
      - hsi
      - scene-scale
      - gt-depth-perturb
      - finetune

loss:
  type: hungarian
  pose_weight: 0.0
  betas_weight: 0.0
  transl_cam_weight: 0.0
  joints3d_weight: 0.0
  projected_joints2d_weight: 0.0
  conf_weight: 0.0
  bbox_weight: 0.0
  giou_weight: 0.0
  projected_bbox_weight: 0.0
  projected_giou_weight: 0.0
  projected_bbox_source: joints
  use_vggt_camera_projection: true
  projection_camera_source: gt
  hsi_pose_weight: 0.0
  hsi_betas_weight: 0.0
  hsi_transl_cam_weight: 0.0
  hsi_ray_delta_weight: 0.0
  hsi_tangent_delta_weight: 0.0
  hsi_joints3d_weight: 0.0
  hsi_vertices_weight: 0.0
  hsi_projected_joints2d_weight: 0.0
  hsi_align_point_weight: 0.0
  hsi_align_delta_reg_weight: 0.0
  hsi_align_no_worse_weight: 0.0
  hsi_depth_teacher_weight: 0.10
  hsi_depth_teacher_max_m: 20.0
  hsi_depth_teacher_error_clip_m: 0.0
  hsi_depth_teacher_use_human_roi: false
  hsi_depth_teacher_require_matched_frame: true
  hsi_depth_teacher_roi_expand: 0.85
  hsi_depth_teacher_min_valid_pixels: 2048
  hsi_smpl_scale_teacher_weight: 4.0
  hsi_smpl_scale_teacher_source: vertices
  hsi_smpl_scale_teacher_use_bias: false
  hsi_smpl_scale_teacher_visibility_tolerance_m: 0.20
  hsi_smpl_scale_teacher_window: 3
  hsi_smpl_scale_teacher_max_points_per_person: 512
  hsi_smpl_scale_teacher_min_points_per_person: 32
  hsi_smpl_scale_teacher_min_visible_points: 128
  hsi_smpl_scale_teacher_mad_multiplier: 2.5
  hsi_smpl_scale_teacher_log_loss: true
  hsi_smpl_scale_teacher_bias_reg_weight: 0.05
  hsi_smpl_scale_teacher_max_z_m: 20.0
  hsi_anchor_depth_weight: 0.0
  hsi_anchor_scene_xyz_weight: 0.0
  hsi_delta_reg_weight: 0.0
  hsi_no_worse_weight: 0.0
  hsi_no_worse_margin_m: 0.005
  hsi_gate_reg_weight: 0.0
  hsi_contact_weight: 0.0
  hsi_foot_contact_weight: 0.0
  hsi_foot_sole_contact_weight: 0.0
  hsi_support_plane_contact_weight: 0.0
  hsi_pose_velocity_weight: 0.0
  hsi_betas_velocity_weight: 0.0
  hsi_transl_velocity_weight: 0.0
  hsi_joints_velocity_weight: 0.0
  hsi_joints_acceleration_weight: 0.0
  hsi_temporal_no_worse_weight: 0.0
  hsi_foot_sliding_weight: 0.0
  hsi_scene_scale_temporal_weight: 0.0
  hsi_scene_scale_sequence_weight: 0.0
  hsi_scene_bias_temporal_weight: 0.0
  hsi_scene_bias_sequence_weight: 0.0
  id_weight: 0.0
  id_temperature: 0.07

matching:
  mode: gt_slots
  enabled: true
  cost_conf: 0.5
  cost_bbox: 8.0
  cost_giou: 4.0
  cost_kpts: 0.0
