experiment:
  name: smpl_hsi_stage2_trstr_translation_only
  output_dir: outputs/train/smpl_hsi_stage2_trstr_translation_only
  seed: 42

data:
  dataset: bedlam
  root_key: datasets.bedlam_root
  train_split: Training
  val_split: ""
  sequence_length: 1
  stride: 1
  image_size: 518
  image_resolution: 512
  resize_mode: balanced
  max_humans: 20
  boxes_root_key: ""
  require_boxes: false
  box_free_gt_slots: true
  require_smpl: true
  require_depth: true
  num_workers: 12
  pin_memory: true

model:
  patch_size: 16
  embed_dim: 1024
  enable_camera: true
  enable_depth: true
  enable_alignment: false
  enable_smpl: true
  smpl_provider: gt_perturbed
  gt_smpl_box_free: true
  gt_smpl_online_visibility: true
  num_smpl_queries: 20
  smpl_query_box_prior: false
  smpl_query_patch_pool: false
  smpl_track_assignment_mode: gt
  smpl_use_external_track_prior: false
  freeze_aggregator: true
  freeze_aggregator_forward: true
  freeze_camera_head: true
  freeze_dense_head: true

  # Retained only as the frozen Stage1 scale/bias host.
  # Its pose/betas/transl branches are not trainable or used by TRSTR.
  enable_hsi_refine: true
  freeze_hsi_refinement: true
  freeze_hsi_scene_affine: true
  freeze_hsi_backbone: true
  enable_hsi_trstr: true
  train_hsi_trstr_only: true
  hsi_trstr_hidden_dim: 256
  hsi_trstr_region_embedding_dim: 32
  hsi_trstr_num_regions: 96
  hsi_trstr_representative_vertices: 8
  hsi_trstr_num_iters: 2
  hsi_trstr_patch_sizes: [3, 7]
  hsi_trstr_min_valid_ratio: 0.25
  hsi_trstr_max_ray_delta_m: 0.35
  hsi_trstr_max_tangent_delta_m: 0.20
  hsi_trstr_max_person_delta_m: 0.50
  hsi_scene_affine_mode: per_frame
  hsi_geometry_mode: gt_metric

  enable_hsi_human_scene_align: false
  enable_hsi_translation_refine_v4: false
  enable_hsi_contact_refine: false
  enable_hsi_grounding: false
  enable_hsi_foot_contact_intent: false

checkpoint:
  resume: outputs/train/smpl_hsi_gt_depth_scale_scene_affine_boxfree/checkpoint_latest.pt
  load_vggt_baseline: true
  strict: false
  resume_strict: false
  resume_optimizer: false
  reset_epoch: true
  resume_required_prefixes:
    - hsi_refinement_head.
  save_scope: hsi
  save_prefixes:
    - hsi_refinement_head.
    - hsi_trstr_head.
  save_optimizer: false
  save_epoch_checkpoint: false
  save_latest: true
  save_final: false
  save_top_k: 1
  save_top_k_from_train: true
  topk_create_stable_copies: false
  monitor: loss_total
  monitor_mode: min

optim:
  batch_size: 8
  epochs: 5
  lr: 0.00001
  weight_decay: 0.05
  grad_clip_norm: 1.0
  log_interval: 20
  log_style: progress
  progress_max_loss_items: 14
  progress_log_keys:
    - loss_total
    - loss_hsi_trstr_vote
    - loss_hsi_trstr_translation
    - loss_hsi_trstr_gate
    - metric_hsi_trstr_vote_l1
    - metric_hsi_trstr_translation_l1
    - metric_hsi_trstr_base_translation_l1
    - metric_hsi_trstr_translation_improvement
    - metric_hsi_trstr_region_valid_ratio
    - metric_hsi_trstr_region_gate_mean
    - metric_hsi_trstr_person_gate_mean
  save_interval: 1
  max_steps_per_epoch: 0
  drop_no_visible_gt_samples: true
  required_supervision_metric: metric_hsi_trstr_region_valid_ratio
  required_supervision_min: 0.0
  allowed_trainable_prefixes:
    - hsi_trstr_head.
  required_trainable_prefixes:
    - hsi_trstr_head.vote_head.
    - hsi_trstr_head.gate_head.
    - hsi_trstr_head.logvar_head.
    - hsi_trstr_head.person_gate_head.
  required_gradient_prefixes:
    - hsi_trstr_head.vote_head.
    - hsi_trstr_head.gate_head.

training_prior:
  center_noise: 0.0
  size_noise: 0.0
  drop_prob: 0.0
  smpl_perturb_mode: translation
  smpl_transl_ray_noise_schedule: 0.25
  smpl_transl_ray_noise_mode: gaussian
  smpl_transl_tangent_noise_schedule_m: 0.10
  smpl_transl_ray_noise_clean_prob: 0.15
  smpl_v4_noise_seed: 42
  gt_smpl_visibility_max_points: 512
  gt_smpl_visibility_decode_batch_size: 128
  gt_smpl_visibility_window: 3
  gt_smpl_visibility_tolerance_m: 0.20
  gt_smpl_visibility_min_points: 32

logging:
  wandb:
    enabled: true
    project: vggt-human
    entity: ""
    name: smpl_hsi_stage2_trstr_translation_only
    group: hsi_stage2_trstr
    mode: online
    log_interval: 20
    tags:
      - hsi
      - trstr
      - translation-only
      - region-query

loss:
  type: hungarian
  pose_weight: 0.0
  betas_weight: 0.0
  transl_cam_weight: 0.0
  joints3d_weight: 0.0
  projected_joints2d_weight: 0.0
  conf_weight: 0.0
  bbox_weight: 0.0
  giou_weight: 0.0
  projected_bbox_weight: 0.0
  projected_giou_weight: 0.0
  use_vggt_camera_projection: false
  projection_camera_source: gt
  hsi_pose_weight: 0.0
  hsi_betas_weight: 0.0
  hsi_transl_cam_weight: 0.0
  hsi_joints3d_weight: 0.0
  hsi_vertices_weight: 0.0
  hsi_projected_joints2d_weight: 0.0
  hsi_depth_teacher_weight: 0.0
  hsi_smpl_scale_teacher_weight: 0.0
  hsi_trstr_vote_weight: 1.0
  hsi_trstr_translation_weight: 4.0
  hsi_trstr_gate_weight: 0.10
  hsi_trstr_delta_reg_weight: 0.01
  hsi_anchor_depth_weight: 0.0
  hsi_anchor_scene_xyz_weight: 0.0
  hsi_delta_reg_weight: 0.0
  hsi_no_worse_weight: 0.0
  hsi_gate_reg_weight: 0.0
  hsi_contact_weight: 0.0
  hsi_foot_contact_weight: 0.0
  hsi_foot_sole_contact_weight: 0.0
  hsi_support_plane_contact_weight: 0.0
  hsi_pose_velocity_weight: 0.0
  hsi_betas_velocity_weight: 0.0
  hsi_transl_velocity_weight: 0.0
  hsi_joints_velocity_weight: 0.0
  hsi_joints_acceleration_weight: 0.0
  hsi_temporal_no_worse_weight: 0.0
  hsi_foot_sliding_weight: 0.0
  hsi_scene_scale_temporal_weight: 0.0
  hsi_scene_scale_sequence_weight: 0.0
  hsi_scene_bias_temporal_weight: 0.0
  hsi_scene_bias_sequence_weight: 0.0
  id_weight: 0.0

matching:
  mode: gt_slots
  enabled: true
  cost_conf: 0.5
  cost_bbox: 0.0
  cost_giou: 0.0
  cost_kpts: 0.0
