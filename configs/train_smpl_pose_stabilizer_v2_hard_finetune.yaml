experiment:
  name: smpl_temporal_stabilizer_v2_pose_hard_finetune
  output_dir: outputs/train/smpl_temporal_stabilizer_v2_pose_hard_finetune
  seed: 43

data:
  sources: []
  window_size: 9
  stride: 1
  validation_fraction: 0.1
  min_valid_frames: 9
  balance_datasets: true
  validation_batch_size: 128
  num_workers: 8
  pin_memory: true

# Must match the V2.1 checkpoint exactly. This is finetuning, not expansion.
model:
  window_size: 9
  proposal_hidden_dim: 256
  gate_hidden_dim: 128
  max_motion_residual_rad: 0.35
  max_blend: 0.5

checkpoint:
  resume: outputs/train/smpl_temporal_stabilizer_v2_pose_mixture_v21_focus/checkpoint_best.pt

mixture:
  clean: 0.30
  centre_jitter: 0.30
  small: 0.20
  medium: 0.10
  hard: 0.10
  centre_jitter_focus_weight: 5.0

noise:
  centre_jitter:
    drift_std_rad: 0.06
    jitter_std_rad: 0.025
    root_multiplier: 1.5
  small:
    drift_std_rad: 0.06
    jitter_std_rad: 0.025
    root_multiplier: 1.5
  medium:
    drift_std_rad: 0.12
    jitter_std_rad: 0.05
    root_multiplier: 1.5
  hard:
    drift_std_rad: 0.18
    jitter_std_rad: 0.075
    root_multiplier: 1.5

optim:
  batch_size: 128
  epochs: 10
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  amp: true
  log_interval: 50

loss:
  final_weight: 2.0
  proposal_weight: 1.0
  blend_weight: 2.0
  angular_velocity_weight: 0.25
  oracle_positive_threshold: 0.02

selection:
  hard_weight: 1.0

logging:
  wandb:
    enabled: true
    project: vggt-human
    entity: ""
    name: smpl_temporal_stabilizer_v2_pose_hard_finetune
    group: smpl_temporal_stabilizer_v2
    mode: online
    tags: [smpl, pose-stabilizer, hard-finetune, clean-identity, centre-jitter, small, medium, hard]
