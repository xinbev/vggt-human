experiment:
  name: smpl_temporal_stabilizer_v2_pose_e1
  output_dir: outputs/eval/smpl_temporal_stabilizer_v2_pose_e1
  seed: 2026

data:
  sources: []
  window_size: 9
  stride: 1
  validation_fraction: 0.1
  min_valid_frames: 9
  eval_batch_size: 128

checkpoint:
  path: outputs/debug/smpl_temporal_stabilizer_v2_pose_e0/checkpoint_e0.pt

cases:
  centre_jitter:
    noise_seed_offset: 11
    noise:
      drift_std_rad: 0.06
      jitter_std_rad: 0.025
      root_multiplier: 1.5
  small:
    noise_seed_offset: 23
    noise:
      drift_std_rad: 0.06
      jitter_std_rad: 0.025
      root_multiplier: 1.5
  medium:
    noise_seed_offset: 37
    noise:
      drift_std_rad: 0.12
      jitter_std_rad: 0.05
      root_multiplier: 1.5

metrics:
  # Target angular speed higher than this is treated as real fast movement.
  fast_speed_threshold_rad: 0.12
  blend_active_threshold: 0.02

acceptance:
  # Clean observations are exactly GT: any final displacement is a false edit.
  clean_root_displacement_max_rad: 0.01
  clean_all_displacement_max_rad: 0.01
  centre_jitter_improvement_min_rad: 0.005
  small_improvement_min_rad: 0.005
  medium_improvement_min_rad: 0.005

logging:
  wandb:
    enabled: true
    project: vggt-human
    entity: ""
    name: smpl_temporal_stabilizer_v2_pose_e1
    group: smpl_temporal_stabilizer_v2
    mode: online
    tags: [smpl, pose-stabilizer, e1-held-out, clean, center-jitter, small, medium]
