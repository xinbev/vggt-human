data:
  # The metric is frame-wise, but the accepted project inference applies its
  # composed scene affine with clip_median over a multi-frame window. Use
  # non-overlapping windows so every source frame is scored exactly once.
  sequence_length: 100
  non_overlapping_windows: true
  image_size: 518
  image_resolution: 512
  resize_mode: balanced
  max_humans: 1

human_scene_evaluation:
  branches: [refined]
  mask_source: gt_smpl_projection
  percentile_trims: [5, 10]
  visibility_backend: pytorch3d
  invalid_policy: show_zero
  compute_paper_audit: false
  depth_conf_threshold: 0.05
  scene_point_stride: 1
  distance_chunk_size: 2048
  min_body_points: 1
  min_scene_points: 1
  min_points_for_percentile: 20

reference_cascade:
  confidence_threshold: 0.05
  coarse_min_anchor_pixels: 32
  coarse_scale_min: 0.10
  coarse_scale_max: 10.0
  coarse_anchor_stride: 8
  coarse_fallback: sequence_median
  effective_affine_mode: clip_median
